<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#FDE68A"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="featherGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Luxury Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Peacock Feather Accent -->
  <path d="M38 12 C44 8, 50 14, 46 22 C43 27, 36 30, 32 34 C36 28, 40 22, 38 12 Z" fill="url(#featherGrad)" opacity="0.9"/>
  <circle cx="43" cy="17" r="2.5" fill="#0284C7"/>
  <circle cx="43" cy="17" r="1.2" fill="#FDE68A"/>

  <!-- Stylized Monogram KA -->
  <!-- Letter K -->
  <path d="M19 19 L19 45 M19 33 L31 19 M23 28 L33 45" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Letter A Swirl -->
  <path d="M29 45 L38 21 L47 45 M32 37 L44 37" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 45 C44 48, 50 44, 46 38" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>